[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-crop-tool"
version = "0.1.0"
description = "A desktop crop tool for grayscale STEM images and image stacks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "PySide6>=6.8,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-qt>=4.4,<5.0",
    "pyinstaller>=6.10,<7.0",
]

[project.gui-scripts]
stem-crop-tool = "stem_crop_tool.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stem_crop_tool = ["assets/*.ico", "assets/*.svg"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
